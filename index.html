<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MADELY | متجر الإبداع</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Tahoma, Arial
        }

        :root {
            --navy: #17233c;
            --gold: #c69b59;
            --bg: #f6f4ef;
            --white: #fff;
            --muted: #777;
            --border: #e9e5dd;
        }

        body {
            background: var(--bg);
            color: var(--navy)
        }

        button,
        input,
        textarea,
        select {
            font: inherit
        }

        button {
            cursor: pointer
        }

        header {
            height: 75px;
            background: var(--navy);
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5%;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 27px;
            font-weight: bold;
            letter-spacing: 2px
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px
        }

        .icon-btn {
            border: 0;
            background: #ffffff18;
            color: white;
            padding: 10px 14px;
            border-radius: 9px;
            font-size: 19px;
        }

        .menu {
            position: fixed;
            right: -310px;
            top: 0;
            width: 290px;
            height: 100%;
            background: var(--navy);
            color: white;
            z-index: 30;
            padding: 25px;
            transition: .3s;
        }

        .menu.open {
            right: 0
        }

        .menu h2 {
            margin: 25px 0
        }

        .menu button {
            display: block;
            width: 100%;
            padding: 16px;
            border: 0;
            border-bottom: 1px solid #ffffff20;
            background: none;
            color: white;
            text-align: right;
        }

        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: #0008;
            z-index: 20;
        }

        .overlay.show {
            display: block
        }

        .hero {
            background: linear-gradient(120deg, #17233c, #394e70);
            color: white;
            text-align: center;
            padding: 75px 20px;
        }

        .hero small {
            color: #e0c18c;
            letter-spacing: 3px
        }

        .hero h1 {
            font-size: 40px;
            margin: 18px 0
        }

        .hero p {
            color: #e0e5ed;
            line-height: 2
        }

        .container {
            max-width: 1150px;
            margin: auto;
            padding: 30px 18px
        }

        .section-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin: 25px 0 18px;
        }

        .section-head h2 {
            font-size: 23px
        }

        .gold-line {
            width: 45px;
            height: 3px;
            background: var(--gold);
            margin-top: 9px
        }

        .search {
            width: 100%;
            padding: 15px 18px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: white;
            outline: none;
        }

        .search:focus {
            border-color: var(--gold)
        }

        .filters {
            display: flex;
            gap: 9px;
            flex-wrap: wrap;
            margin: 15px 0 22px
        }

        .filter {
            border: 1px solid var(--border);
            background: white;
            padding: 10px 17px;
            border-radius: 30px;
            color: var(--navy);
        }

        .filter.active {
            background: var(--navy);
            color: white
        }

        .products {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid var(--border);
            transition: .2s;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px #17233c12
        }

        .product-image {
            height: 220px;
            background: #eeeae2;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover
        }

        .no-image {
            font-size: 45px;
            color: #b5a88f
        }

        .offer-tag {
            position: absolute;
            top: 12px;
            right: 12px;
            background: var(--gold);
            color: white;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 12px;
        }

        .favorite {
            position: absolute;
            top: 12px;
            left: 12px;
            background: white;
            border: 0;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            font-size: 20px;
            color: #888;
        }

        .favorite.selected {
            color: #e34b67
        }

        .card-info {
            padding: 17px
        }

        .card-info h3 {
            margin-bottom: 9px
        }

        .description {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.8;
            min-height: 25px
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            color: #a87935;
            margin: 13px 0
        }

        .old-price {
            font-size: 13px;
            color: #999;
            text-decoration: line-through;
            margin-right: 8px
        }

        .buy {
            display: block;
            background: var(--navy);
            color: white;
            padding: 12px;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
        }

        .empty {
            grid-column: 1/-1;
            text-align: center;
            padding: 45px 10px;
            color: var(--muted);
            background: white;
            border-radius: 12px;
        }

        .admin {
            background: white;
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 22px;
            margin-top: 45px;
        }

        .admin h2 {
            margin-bottom: 15px
        }

        .field {
            margin: 13px 0
        }

        .field label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px
        }

        .field input,
        .field textarea,
        .field select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: white;
            outline: none;
        }

        .field textarea {
            height: 85px;
            resize: vertical
        }

        .row-fields {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px
        }

        .primary {
            background: var(--navy);
            color: white;
            border: 0;
            border-radius: 8px;
            padding: 13px 20px;
        }

        .secondary {
            background: #eeeae2;
            color: var(--navy);
            border: 0;
            border-radius: 8px;
            padding: 12px 18px;
        }

        .delete {
            background: #bd3c4c;
            color: white;
            border: 0;
            padding: 9px 12px;
            border-radius: 7px;
            margin-top: 12px;
        }

        .edit {
            background: #d6a75f;
            color: #17233c;
            border: 0;
            padding: 9px 12px;
            border-radius: 7px;
            margin-top: 12px;
            margin-left: 5px;
        }

        .admin-product {
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 9px;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .admin-product button {
            font-size: 12px
        }

        .status {
            color: #298451;
            font-size: 13px;
            margin-top: 12px
        }

        footer {
            margin-top: 45px;
            background: var(--navy);
            color: white;
            text-align: center;
            padding: 35px 15px;
            line-height: 2.2;
        }

        footer a {
            color: #e5c48e;
            text-decoration: none
        }

        @media(max-width:750px) {
            .products {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px
            }

            .product-image {
                height: 155px
            }

            .hero h1 {
                font-size: 29px
            }

            .card-info {
                padding: 12px
            }

            .row-fields {
                grid-template-columns: 1fr
            }
        }

        @media(max-width:400px) {
            .products {
                grid-template-columns: 1fr
            }

            .product-image {
                height: 210px
            }
        }
    </style>
</head>

<body>

    <header>
        <button class="icon-btn" onclick="toggleMenu()">☰</button>
        <div class="logo">MADELY</div>
        <div class="header-actions">
            <button class="icon-btn" onclick="showFavorites()">♡</button>
        </div>
    </header>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <nav class="menu" id="menu">
        <button onclick="toggleMenu()">✕ إغلاق</button>
        <h2>MADELY</h2>
        <button onclick="go('home')">الرئيسية</button>
        <button onclick="go('products')">جميع المنتجات</button>
        <button onclick="showFavorites()">♡ المفضلة</button>
        <button onclick="showOffers()">العروض</button>
        <button onclick="go('admin')">إدارة المتجر</button>
        <button onclick="go('contact')">تواصل معنا</button>
    </nav>

    <section class="hero" id="home">
        <small>MADE WITH CREATIVITY</small>
        <h1>مرحباً بك في MADELY</h1>
        <p>منتجات يدوية صنعت بإبداع واهتمام بالتفاصيل</p>
    </section>

    <main class="container">

        <section id="products">
            <div class="section-head">
                <div>
                    <h2 id="listTitle">اكتشف منتجاتنا</h2>
                    <div class="gold-line"></div>
                </div>
            </div>

            <input class="search" id="search"
placeholder="ابحث عن منتج..." oninput="render()">

            <div class="filters">
                <button class="filter active" onclick="setFilter('all',this)">الكل</button>
                <button class="filter" onclick="setFilter('offers',this)">العروض</button>
                <button class="filter" onclick="setFilter('favorites',this)">المفضلة</button>
            </div>

            <div class="products" id="productsList"></div>
        </section>

        <section class="admin" id="admin">
            <h2>⚙️ إدارة المتجر</h2>
            <p>أضف منتجاتك وتحكم في الإعلانات.</p>

            <form id="productForm">
                <input type="hidden" id="editId">

                <div class="field">
                    <label>اسم المنتج</label>
                    <input id="name" required maxlength="70" placeholder="اسم المنتج">
                </div>

                <div class="row-fields">
                    <div class="field">
                        <label>السعر بالجنيه</label>
                        <input id="price" type="number" min="0.01" step="0.01" required>
                    </div>
                    <div class="field">
                        <label>السعر قبل الخصم (اختياري)</label>
                        <input id="oldPrice" type="number" min="0" step="0.01">
                    </div>
                </div>

                <div class="field">
                    <label>وصف المنتج</label>
                    <textarea id="description" maxlength="500" placeholder="اكتب وصف المنتج..."></textarea>
                </div>

                <div class="field">
                    <label>صورة المنتج (اختياري)</label>
                    <input id="image" type="file" accept="image/*">
                </div>

                <button class="primary" type="submit" id="saveButton">نشر المنتج</button>
                <button class="secondary" type="button" onclick="resetForm()">إلغاء</button>
                <p class="status" id="status"></p>
            </form>

            <h3 style="margin-top:25px">المنتجات المنشورة</h3>
            <div id="adminList"></div>
        </section>
    </main>

    <footer id="contact">
        <h2>MADELY</h2>
        <p>الإبداع يبدأ بفكرة</p>
        <p>للتواصل: 01202807281</p>
        <a href="https://wa.me/201202807281" target="_blank" rel="noopener">
            تواصل معنا عبر واتساب
        </a>
        <p>© MADELY جميع الحقوق محفوظة</p>
    </footer>

    <script>
        const KEY="madely_v2_products";
const FAVKEY="madely_v2_favorites";
const PHONE="201202807281";

let products=[];
let favorites=[];
let currentFilter="all";

try{
products=JSON.parse(localStorage.getItem(KEY))||[];
favorites=JSON.parse(localStorage.getItem(FAVKEY))||[];
if(!Array.isArray(products))products=[];
if(!Array.isArray(favorites))favorites=[];
}catch(e){products=[];favorites=[];}

function persist(){
try{
localStorage.setItem(KEY,JSON.stringify(products));
localStorage.setItem(FAVKEY,JSON.stringify(favorites));
return true;
}catch(e){
alert("مساحة التخزين غير كافية. جرّب صورة أصغر.");
return false;
}
}

function toggleMenu(){
document.getElementById("menu").classList.toggle("open");
document.getElementById("overlay").classList.toggle("show");
}

function go(id){
toggleMenuIfOpen();
document.getElementById(id).scrollIntoView({behavior:"smooth"});
}

function toggleMenuIfOpen(){
document.getElementById("menu").classList.remove("open");
document.getElementById("overlay").classList.remove("show");
}

function setFilter(filter,button){
currentFilter=filter;
document.querySelectorAll(".filter").forEach(b=>b.classList.remove("active"));
button.classList.add("active");
document.getElementById("listTitle").textContent=
filter==="offers"?"العروض":filter==="favorites"?"منتجاتك المفضلة":"اكتشف منتجاتنا";
render();
}

function showFavorites(){
currentFilter="favorites";
toggleMenuIfOpen();
document.querySelectorAll(".filter").forEach(b=>b.classList.remove("active"));
document.querySelectorAll(".filter")[2].classList.add("active");
document.getElementById("listTitle").textContent="منتجاتك المفضلة";
document.getElementById("products").scrollIntoView({behavior:"smooth"});
render();
}

function showOffers(){
currentFilter="offers";
toggleMenuIfOpen();
document.querySelectorAll(".filter").forEach(b=>b.classList.remove("active"));
document.querySelectorAll(".filter")[1].classList.add("active");
document.getElementById("listTitle").textContent="العروض";
document.getElementById("products").scrollIntoView({behavior:"smooth"});
render();
}

function render(){
const list=document.getElementById("productsList");
list.replaceChildren();
const query=document.getElementById("search").value.trim().toLowerCase();

let visible=products.filter(p=>{
const matches=(p.name+" "+p.description).toLowerCase().includes(query);
const offer=p.oldPrice && Number(p.oldPrice)>Number(p.price);
return matches &&
(currentFilter==="all" ||
(currentFilter==="offers" && offer) ||
(currentFilter==="favorites" && favorites.includes(p.id)));
});

if(!visible.length){
const empty=document.createElement("div");
empty.className="empty";
empty.textContent=currentFilter==="favorites"?
"لم تضف منتجات إلى المفضلة بعد.":
"لا توجد منتجات مطابقة حالياً.";
list.appendChild(empty);
}else{
visible.forEach(p=>{
const card=document.createElement("article");
card.className="card";
const visual=document.createElement("div");
visual.className="product-image";

if(p.image){
const img=document.createElement("img");
img.src=p.image;img.alt=p.name;
visual.appendChild(img);
}else{
const no=document.createElement("span");
no.className="no-image";no.textContent="✦";
visual.appendChild(no);
}

if(p.oldPrice && Number(p.oldPrice)>Number(p.price)){
const tag=document.createElement("span");
tag.className="offer-tag";tag.textContent="عرض خاص";
visual.appendChild(tag);
}

const fav=document.createElement("button");
fav.className="favorite "+(favorites.includes(p.id)?"selected":"");
fav.textContent=favorites.includes(p.id)?"♥":"♡";
fav.onclick=()=>toggleFavorite(p.id);
visual.appendChild(fav);

const info=document.createElement("div");
info.className="card-info";
const title=document.createElement("h3");title.textContent=p.name;
const desc=document.createElement("p");desc.className="description";desc.textContent=p.description;
const price=document.createElement("div");price.className="price";
price.textContent=p.price+" جنيه";

if(p.oldPrice && Number(p.oldPrice)>Number(p.price)){
const old=document.createElement("span");
old.className="old-price";old.textContent=p.oldPrice+" جنيه";
price.appendChild(old);
}

const buy=document.createElement("a");
buy.className="buy";buy.textContent="اطلب عبر واتساب";
buy.href="https://wa.me/"+PHONE+"?text="+encodeURIComponent("أريد طلب المنتج: "+p.name);
buy.target="_blank";buy.rel="noopener";

info.append(title,desc,price,buy);
card.append(visual,info);
list.appendChild(card);
});
}
renderAdmin();
}

function toggleFavorite(id){
const old=[...favorites];
favorites=favorites.includes(id)?
favorites.filter(x=>x!==id):[...favorites,id];
if(!persist()){favorites=old;return;}
render();
}

function renderAdmin(){
const box=document.getElementById("adminList");
box.replaceChildren();
products.forEach(p=>{
const row=document.createElement("div");
row.className="admin-product";
const title=document.createElement("strong");
title.textContent=p.name+" - "+p.price+" جنيه";
const controls=document.createElement("div");
const edit=document.createElement("button");
edit.className="edit";edit.textContent="تعديل";
edit.onclick=()=>editProduct(p.id);
const del=document.createElement("button");
del.className="delete";del.textContent="حذف";
del.onclick=()=>deleteProduct(p.id);
controls.append(edit,del);row.append(title,controls);box.appendChild(row);
});
}

function resetForm(){
document.getElementById("productForm").reset();
document.getElementById("editId").value="";
document.getElementById("saveButton").textContent="نشر المنتج";
}

function editProduct(id){
const p=products.find(x=>x.id===id);
if(!p)return;
document.getElementById("editId").value=p.id;
document.getElementById("name").value=p.name;
document.getElementById("price").value=p.price;
document.getElementById("oldPrice").value=p.oldPrice||"";
document.getElementById("description").value=p.description||"";
document.getElementById("saveButton").textContent="حفظ التعديلات";
document.getElementById("admin").scrollIntoView({behavior:"smooth"});
}

function deleteProduct(id){
if(!confirm("هل تريد حذف هذا المنتج؟"))return;
const oldProducts=products;
const oldFavorites=favorites;
products=products.filter(p=>p.id!==id);
favorites=favorites.filter(x=>x!==id);
if(!persist()){products=oldProducts;favorites=oldFavorites;return;}
render();
}

document.getElementById("productForm").addEventListener("submit",async function(e){
e.preventDefault();
const id=document.getElementById("editId").value;
const name=document.getElementById("name").value.trim();
const price=Number(document.getElementById("price").value);
const oldPrice=document.getElementById("oldPrice").value;
const description=document.getElementById("description").value.trim();
const file=document.getElementById("image").files[0];

if(!name || !Number.isFinite(price) || price<=0){
alert("تحقق من اسم المنتج والسعر.");return;
}
if(oldPrice && (!Number.isFinite(Number(oldPrice)) || Number(oldPrice)<=price)){
alert("يجب أن يكون السعر السابق أكبر من السعر الحالي.");return;
}
if(file && !file.type.startsWith("image/")){
alert("اختر ملف صورة صالحاً.");return;
}
if(file && file.size>500*1024){
alert("اختر صورة أصغر من 500 كيلوبايت.");return;
}

let imageData="";
if(file){
try{
imageData=await new Promise((resolve,reject)=>{
const reader=new FileReader();
reader.onload=()=>resolve(reader.result);
reader.onerror=reject;
reader.readAsDataURL(file);
});
}catch(e){alert("تعذرت قراءة الصورة.");return;}
}

const oldProducts=[...products];
if(id){
const index=products.findIndex(p=>String(p.id)===id);
if(index<0)return;
products[index]={...products[index],name,price,oldPrice,description,
image:imageData||products[index].image||""};
}else{
products.unshift({id:Date.now(),name,price,oldPrice,description,image:imageData});
}

if(!persist()){products=oldProducts;return;}
resetForm();
document.getElementById("status").textContent="تم حفظ المنتج بنجاح.";
render();
});

render();
    </script>
</body>

</html>
